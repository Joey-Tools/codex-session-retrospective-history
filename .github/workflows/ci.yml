name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare trusted push validator
        if: github.event_name == 'push'
        env:
          BASE_REV: ${{ github.event.before }}
        run: |
          TRUSTED_VALIDATOR_ROOT="$RUNNER_TEMP/retrospective-history-v2-trusted-base"
          git worktree add --quiet --detach "$TRUSTED_VALIDATOR_ROOT" "$BASE_REV"
          TRUSTED_KEY="$TRUSTED_VALIDATOR_ROOT/retrospective-history-v2-publisher.asc"
          TRUSTED_VALIDATOR="$TRUSTED_VALIDATOR_ROOT/scripts/retrospective_history_git_v2.py"
          KEY_EXISTS=false
          VALIDATOR_EXISTS=false
          if [ -e "$TRUSTED_KEY" ] || [ -L "$TRUSTED_KEY" ]; then
            KEY_EXISTS=true
          fi
          if [ -e "$TRUSTED_VALIDATOR" ] || [ -L "$TRUSTED_VALIDATOR" ]; then
            VALIDATOR_EXISTS=true
          fi
          if [ "$KEY_EXISTS" = true ] && [ "$VALIDATOR_EXISTS" = true ]; then
            if [ ! -f "$TRUSTED_KEY" ] || [ -L "$TRUSTED_KEY" ] || \
              [ ! -f "$TRUSTED_VALIDATOR" ] || [ -L "$TRUSTED_VALIDATOR" ]; then
              echo "Trusted push base artifacts are unsafe." >&2
              exit 1
            fi
            PUSH_VALIDATION_MODE=trusted
          elif [ "$KEY_EXISTS" = false ] && [ "$VALIDATOR_EXISTS" = false ]; then
            PUSH_VALIDATION_MODE=bootstrap
          else
            echo "Trusted push base is partially initialized." >&2
            exit 1
          fi
          echo "TRUSTED_VALIDATOR_ROOT=$TRUSTED_VALIDATOR_ROOT" >> "$GITHUB_ENV"
          echo "PUSH_VALIDATION_MODE=$PUSH_VALIDATION_MODE" >> "$GITHUB_ENV"
      - name: Validate first push bootstrap range
        if: github.event_name == 'push'
        env:
          BASE_REV: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          HEAD_REV: ${{ github.event.after }}
        run: |
          if [ "$PUSH_VALIDATION_MODE" != bootstrap ]; then
            exit 0
          fi
          if [ "$EVENT_FORCED" = true ] || \
            ! git merge-base --is-ancestor "$BASE_REV" "$HEAD_REV"; then
            echo "Bootstrap push must be a non-force descendant of its event base." >&2
            exit 1
          fi
          MAX_BOOTSTRAP_COMMITS=512
          COMMIT_OUTPUT="$(
            git rev-list --first-parent --reverse \
              --max-count="$((MAX_BOOTSTRAP_COMMITS + 1))" \
              "$BASE_REV..$HEAD_REV"
          )"
          COMMITS=()
          if [ -n "$COMMIT_OUTPUT" ]; then
            while IFS= read -r COMMIT_REV; do
              COMMITS+=("$COMMIT_REV")
            done <<< "$COMMIT_OUTPUT"
          fi
          if [ "${#COMMITS[@]}" -eq 0 ] || \
            [ "${#COMMITS[@]}" -gt "$MAX_BOOTSTRAP_COMMITS" ]; then
            echo "Bootstrap push exceeds its bounded linear range." >&2
            exit 1
          fi
          EXPECTED_PARENT="$BASE_REV"
          SAW_INFRASTRUCTURE_CHANGE=false
          for COMMIT_REV in "${COMMITS[@]}"; do
            PARENT_LINE="$(git rev-list --parents --max-count=1 "$COMMIT_REV")"
            read -r -a PARENT_FIELDS <<< "$PARENT_LINE"
            if [ "${#PARENT_FIELDS[@]}" -ne 2 ] || \
              [ "${PARENT_FIELDS[0]}" != "$COMMIT_REV" ] || \
              [ "${PARENT_FIELDS[1]}" != "$EXPECTED_PARENT" ]; then
              echo "Bootstrap push must use bounded linear infrastructure commits." >&2
              exit 1
            fi
            if git diff-tree --quiet --no-commit-id -r --no-renames \
              "$EXPECTED_PARENT" "$COMMIT_REV" -- runs; then
              :
            else
              DIFF_STATUS=$?
              if [ "$DIFF_STATUS" -eq 1 ]; then
                echo "Bootstrap push must not change retained publications." >&2
              else
                echo "Bootstrap push range inspection failed." >&2
              fi
              exit 1
            fi
            if git diff-tree --quiet --no-commit-id -r --no-renames \
              "$EXPECTED_PARENT" "$COMMIT_REV" --; then
              :
            else
              DIFF_STATUS=$?
              if [ "$DIFF_STATUS" -eq 1 ]; then
                SAW_INFRASTRUCTURE_CHANGE=true
              else
                echo "Bootstrap push range inspection failed." >&2
                exit 1
              fi
            fi
            EXPECTED_PARENT="$COMMIT_REV"
          done
          if [ "$EXPECTED_PARENT" != "$HEAD_REV" ] || \
            [ "$SAW_INFRASTRUCTURE_CHANGE" != true ]; then
            echo "Bootstrap push must contain only infrastructure changes." >&2
            exit 1
          fi

          MAX_BOOTSTRAP_TREE_BYTES=8388608
          MAX_BOOTSTRAP_TREE_ENTRIES=65536
          MAX_BOOTSTRAP_TREE_ENTRY_BYTES=4096
          MAX_BOOTSTRAP_KEY_BYTES=65536
          MAX_BOOTSTRAP_VALIDATOR_BYTES=1048576
          export LC_ALL=C

          bootstrap_pair_failure() {
            echo "Bootstrap push must install the complete trusted validation pair." >&2
            exit 1
          }

          validate_bootstrap_tree_object() {
            local object_id="$1"
            local object_type object_size
            if ! object_type="$(git cat-file -t "$object_id" 2>/dev/null)" || \
              [ "$object_type" != tree ]; then
              return 1
            fi
            if ! object_size="$(git cat-file -s "$object_id" 2>/dev/null)"; then
              return 1
            fi
            case "$object_size" in
              ''|*[!0-9]*) return 1 ;;
            esac
            if [ "$object_size" -le 0 ] || \
              [ "$object_size" -gt "$MAX_BOOTSTRAP_TREE_BYTES" ]; then
              return 1
            fi
          }

          find_unique_bootstrap_entry() {
            local listing="$1"
            local expected_name="$2"
            local entry metadata entry_name extra
            local entry_count=0
            local match_count=0
            BOOTSTRAP_ENTRY_MODE=
            BOOTSTRAP_ENTRY_TYPE=
            BOOTSTRAP_ENTRY_OBJECT=
            BOOTSTRAP_ENTRY_NAME=
            while IFS= read -r -d '' entry; do
              entry_count=$((entry_count + 1))
              if [ "$entry_count" -gt "$MAX_BOOTSTRAP_TREE_ENTRIES" ] || \
                [ "${#entry}" -gt "$MAX_BOOTSTRAP_TREE_ENTRY_BYTES" ]; then
                return 1
              fi
              case "$entry" in
                *$'\t'*) ;;
                *) return 1 ;;
              esac
              metadata="${entry%%$'\t'*}"
              entry_name="${entry#*$'\t'}"
              if [[ "$entry_name" == "$expected_name" ]]; then
                match_count=$((match_count + 1))
                BOOTSTRAP_ENTRY_NAME="$entry_name"
                extra=
                IFS=' ' read -r BOOTSTRAP_ENTRY_MODE BOOTSTRAP_ENTRY_TYPE \
                  BOOTSTRAP_ENTRY_OBJECT extra <<< "$metadata"
                if [ -n "$extra" ] || [ -z "$BOOTSTRAP_ENTRY_OBJECT" ]; then
                  return 1
                fi
              fi
            done < "$listing"
            if [ "$match_count" -ne 1 ] || \
              [ "$BOOTSTRAP_ENTRY_NAME" != "$expected_name" ]; then
              return 1
            fi
          }

          validate_bootstrap_regular_blob() {
            local mode="$1"
            local declared_type="$2"
            local object_id="$3"
            local maximum_size="$4"
            local object_type object_size
            if [ "$declared_type" != blob ] || \
              { [ "$mode" != 100644 ] && [ "$mode" != 100755 ]; }; then
              return 1
            fi
            if ! object_type="$(git cat-file -t "$object_id" 2>/dev/null)" || \
              [ "$object_type" != blob ]; then
              return 1
            fi
            if ! object_size="$(git cat-file -s "$object_id" 2>/dev/null)"; then
              return 1
            fi
            case "$object_size" in
              ''|*[!0-9]*) return 1 ;;
            esac
            if [ "$object_size" -le 0 ] || \
              [ "$object_size" -gt "$maximum_size" ]; then
              return 1
            fi
          }

          shopt -s nocasematch
          if ! HEAD_TREE="$(git rev-parse --verify "$HEAD_REV^{tree}" 2>/dev/null)" || \
            ! validate_bootstrap_tree_object "$HEAD_TREE"; then
            bootstrap_pair_failure
          fi
          BOOTSTRAP_TREE_LIST="$(
            mktemp "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/retrospective-bootstrap-tree.XXXXXX" \
              2>/dev/null
          )" || bootstrap_pair_failure
          trap 'rm -f "$BOOTSTRAP_TREE_LIST"' EXIT
          if ! git ls-tree -z "$HEAD_TREE" > "$BOOTSTRAP_TREE_LIST" 2>/dev/null; then
            bootstrap_pair_failure
          fi

          if ! find_unique_bootstrap_entry \
            "$BOOTSTRAP_TREE_LIST" retrospective-history-v2-publisher.asc; then
            bootstrap_pair_failure
          fi
          if ! validate_bootstrap_regular_blob \
            "$BOOTSTRAP_ENTRY_MODE" "$BOOTSTRAP_ENTRY_TYPE" \
            "$BOOTSTRAP_ENTRY_OBJECT" "$MAX_BOOTSTRAP_KEY_BYTES"; then
            bootstrap_pair_failure
          fi

          if ! find_unique_bootstrap_entry "$BOOTSTRAP_TREE_LIST" scripts || \
            [ "$BOOTSTRAP_ENTRY_MODE" != 040000 ] || \
            [ "$BOOTSTRAP_ENTRY_TYPE" != tree ]; then
            bootstrap_pair_failure
          fi
          SCRIPTS_TREE="$BOOTSTRAP_ENTRY_OBJECT"
          if ! validate_bootstrap_tree_object "$SCRIPTS_TREE" || \
            ! git ls-tree -z "$SCRIPTS_TREE" \
              > "$BOOTSTRAP_TREE_LIST" 2>/dev/null; then
            bootstrap_pair_failure
          fi
          if ! find_unique_bootstrap_entry \
            "$BOOTSTRAP_TREE_LIST" retrospective_history_git_v2.py; then
            bootstrap_pair_failure
          fi
          if ! validate_bootstrap_regular_blob \
            "$BOOTSTRAP_ENTRY_MODE" "$BOOTSTRAP_ENTRY_TYPE" \
            "$BOOTSTRAP_ENTRY_OBJECT" "$MAX_BOOTSTRAP_VALIDATOR_BYTES"; then
            bootstrap_pair_failure
          fi
      - name: Import trusted push publisher key
        if: github.event_name == 'push'
        run: |
          if [ "$PUSH_VALIDATION_MODE" != trusted ]; then
            exit 0
          fi
          TRUSTED_GNUPGHOME="$RUNNER_TEMP/retrospective-history-v2-trusted-gnupg"
          export TRUSTED_GNUPGHOME
          install -d -m 700 "$TRUSTED_GNUPGHOME"
          GNUPGHOME="$TRUSTED_GNUPGHOME" gpg --quiet --no-options \
            --no-autostart --batch --import \
            "$TRUSTED_VALIDATOR_ROOT/retrospective-history-v2-publisher.asc" \
            >/dev/null 2>&1
          echo "TRUSTED_GNUPGHOME=$TRUSTED_GNUPGHOME" >> "$GITHUB_ENV"
      - name: Validate push range with trusted base
        if: github.event_name == 'push'
        env:
          BASE_REV: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          HEAD_REV: ${{ github.event.after }}
        run: |
          if [ "$PUSH_VALIDATION_MODE" != trusted ]; then
            exit 0
          fi
          export GNUPGHOME="$TRUSTED_GNUPGHOME"
          cd "$TRUSTED_VALIDATOR_ROOT"
          PYTHONPATH="$TRUSTED_VALIDATOR_ROOT" PYTHONNOUSERSITE=1 python -P - <<'PY'
          import os
          from pathlib import Path

          from scripts.retrospective_history_git_v2 import validate_append_only_range

          issues = []
          if os.environ["EVENT_FORCED"] == "true":
              issues.append("range: force-push event is not append-only")
          issues.extend(
              validate_append_only_range(
                  Path(os.environ["GITHUB_WORKSPACE"]),
                  os.environ["BASE_REV"],
                  os.environ["HEAD_REV"],
              )
          )
          for issue in issues:
              print(issue)
          raise SystemExit(bool(issues))
          PY
      - name: Import v2 publisher public key
        env:
          EXPECTED_FINGERPRINT: 40FA5D05AC7A3D5C180B037FF6DCF7A06FFC9C52
          EXPECTED_UID: Codex Session Retrospective Publisher <12524680+JoeyTeng@users.noreply.github.com>
          PUBLISHER_PUBLIC_KEY: retrospective-history-v2-publisher.asc
        run: |
          GNUPGHOME="$RUNNER_TEMP/retrospective-history-v2-gnupg"
          export GNUPGHOME
          install -d -m 700 "$GNUPGHOME"
          gpg --quiet --no-options --no-autostart --batch \
            --import "$PUBLISHER_PUBLIC_KEY" >/dev/null 2>&1
          KEY_RECORDS="$(
            gpg --quiet --no-options --no-autostart --batch --with-colons \
              --fingerprint --list-keys 2>/dev/null
          )"
          ACTUAL_FINGERPRINT="$(
            printf '%s\n' "$KEY_RECORDS" |
              awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; exit }'
          )"
          PRIMARY_KEY_COUNT="$(
            printf '%s\n' "$KEY_RECORDS" |
              awk -F: '$1 == "pub" { count += 1 } END { print count + 0 }'
          )"
          UID_COUNT="$(
            printf '%s\n' "$KEY_RECORDS" |
              awk -F: '$1 == "uid" { count += 1 } END { print count + 0 }'
          )"
          ACTUAL_UID="$(
            printf '%s\n' "$KEY_RECORDS" |
              awk -F: '$1 == "uid" { print $10; exit }'
          )"
          test "$PRIMARY_KEY_COUNT" = 1
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
          test "$UID_COUNT" = 1
          test "$ACTUAL_UID" = "$EXPECTED_UID"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Install v2 validation dependencies
        run: python -m pip install --requirement requirements-v2.txt
      - name: Validate JSON syntax
        run: |
          python -m json.tool schemas/session-retrospective-v1.schema.json >/dev/null
          python -m json.tool schemas/retained-manifest-v1.schema.json >/dev/null
          python -m json.tool schemas/session-retrospective-v2.schema.json >/dev/null
          python -m json.tool schemas/retained-manifest-v2.schema.json >/dev/null
      - name: Meta-validate v2 schemas
        run: >-
          python -c 'import json; from pathlib import Path; from jsonschema import Draft202012Validator;
          schemas = ("schemas/session-retrospective-v2.schema.json", "schemas/retained-manifest-v2.schema.json");
          [Draft202012Validator.check_schema(json.loads(Path(schema).read_text(encoding="utf-8"))) for schema in schemas]'
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Require current pull request base
        if: github.event_name == 'pull_request'
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_REV: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git merge-base --is-ancestor "$BASE_TIP" "$HEAD_REV"; then
            echo "Pull request head does not contain the current event base." >&2
            exit 1
          fi
      - name: Reject pull request publication changes
        if: github.event_name == 'pull_request'
        env:
          BASE_TIP: ${{ github.event.pull_request.base.sha }}
          HEAD_REV: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "$BASE_TIP" "$HEAD_REV" -- runs; then
            echo "Pull requests must not modify formal retained-history publications." >&2
            exit 1
          fi
      - name: Validate retained history tree
        run: python scripts/validate_retained_history.py --root .
      - name: Validate append-only pull request range
        if: github.event_name == 'pull_request'
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
          EVENT_FORCED: "false"
          HEAD_REV: ${{ github.event.pull_request.head.sha }}
        run: >-
          python scripts/validate_retained_history.py --root .
          --base-rev "$BASE_REV" --head-rev "$HEAD_REV"
          --event-forced "$EVENT_FORCED"
      - name: Validate append-only master push range
        if: github.event_name == 'push'
        env:
          BASE_REV: ${{ github.event.before }}
          EVENT_FORCED: ${{ github.event.forced }}
          HEAD_REV: ${{ github.event.after }}
        run: >-
          python scripts/validate_retained_history.py --root .
          --base-rev "$BASE_REV" --head-rev "$HEAD_REV"
          --event-forced "$EVENT_FORCED"
