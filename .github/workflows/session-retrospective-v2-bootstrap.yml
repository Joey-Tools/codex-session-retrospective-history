name: Session Retrospective v2 Bootstrap

on:
  pull_request_target:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
      - edited

permissions: {}

env:
  GIT_ALTERNATE_OBJECT_DIRECTORIES: ""
  GIT_CONFIG_COUNT: "0"
  GIT_CONFIG_GLOBAL: /dev/null
  GIT_CONFIG_NOSYSTEM: "1"
  GIT_LITERAL_PATHSPECS: "1"
  GIT_NO_LAZY_FETCH: "1"
  GIT_NO_REPLACE_OBJECTS: "1"
  GIT_OPTIONAL_LOCKS: "0"
  GIT_TERMINAL_PROMPT: "0"
  RETROSPECTIVE_HISTORY_MUTATION_MODEL: external-admission-cas-only
  RETROSPECTIVE_HISTORY_TCB: baseline-owned-pr-feedback_external-admission-cas

concurrency:
  group: "retrospective-v2-bootstrap-${{ github.event.pull_request.number || github.sha }}"
  cancel-in-progress: false

jobs:
  trusted_history_gate:
    name: Trusted history gate
    if: "${{ github.event_name == 'pull_request_target' && github.event.pull_request.draft == false && github.event.pull_request.base.repo.full_name == github.repository && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == 'master' && github.event.pull_request.head.ref == 'wip/session-retrospective-v2-history-bootstrap' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      CANDIDATE_GIT_DIR: "${{ github.workspace }}/candidate.git"
      CANDIDATE_ROOT: "${{ github.workspace }}/candidate"
      PREFLIGHT_MANIFEST: "${{ github.workspace }}/.trusted-bootstrap-state/preflight.json"
      TRUSTED_ROOT: "${{ github.workspace }}/trusted"
      TRUSTED_SHA: "${{ github.event.pull_request.base.sha }}"
    steps:
      -
        name: Bind trusted bootstrap event source
        shell: bash
        env:
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref }}"
          EVENT_BASE_REPOSITORY: "${{ github.event.pull_request.base.repo.full_name }}"
          EVENT_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          EVENT_DRAFT: "${{ github.event.pull_request.draft }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref }}"
          EVENT_HEAD_REPOSITORY: "${{ github.event.pull_request.head.repo.full_name }}"
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          EVENT_MERGED: "${{ github.event.pull_request.merged }}"
          EVENT_MERGED_AT: "${{ github.event.pull_request.merged_at }}"
          EVENT_NODE_ID: "${{ github.event.pull_request.node_id }}"
          EVENT_NUMBER: "${{ github.event.pull_request.number }}"
          EVENT_STATE: "${{ github.event.pull_request.state }}"
        run: |
          set -euo pipefail

          validate_sha() {
            case "$1" in
              ""|*[!0-9a-f]*)
                return 1
                ;;
            esac
            [ "${#1}" -eq 40 ] || [ "${#1}" -eq 64 ]
          }

          validate_sha "$TRUSTED_SHA"
          if [ "$GITHUB_WORKFLOW_SHA" != "$TRUSTED_SHA" ]; then
            echo "Bootstrap workflow source is not the exact trusted base." >&2
            exit 1
          fi
          install -d -m 700 "$(dirname "$PREFLIGHT_MANIFEST")"
          validate_sha "$EVENT_BASE_SHA"
          validate_sha "$EVENT_HEAD_SHA"
          case "$EVENT_NUMBER" in
            ""|0|*[!0-9]*)
              echo "Pull request number is invalid." >&2
              exit 1
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" != pull_request_target ] || \
             [ "$GITHUB_SHA" != "$EVENT_BASE_SHA" ] || \
             [ "$EVENT_BASE_REPOSITORY" != "$GITHUB_REPOSITORY" ] || \
             [ "$EVENT_HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ] || \
             [ "$EVENT_BASE_REF" != master ] || \
             [ "$EVENT_HEAD_REF" != wip/session-retrospective-v2-history-bootstrap ] || \
             [ "$EVENT_STATE" != open ] || \
             [ "$EVENT_MERGED" != false ] || \
             [ "$EVENT_DRAFT" != false ] || \
             [ -n "$EVENT_MERGED_AT" ]; then
            echo "Bootstrap gate received an unsupported event." >&2
            exit 1
          fi
          {
            printf 'EVENT_KIND=candidate\n'
            printf 'B0_SHA=%s\n' "$EVENT_BASE_SHA"
            printf 'CANDIDATE_SHA=%s\n' "$EVENT_HEAD_SHA"
            printf 'PR_NUMBER=%s\n' "$EVENT_NUMBER"
          } >>"$GITHUB_ENV"
      -
        name: Checkout exact trusted B0
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: "${{ github.repository }}"
          ref: "${{ env.TRUSTED_SHA }}"
          path: trusted
          fetch-depth: 2
          clean: true
          lfs: false
          submodules: false
          set-safe-directory: false
          persist-credentials: false
      -
        name: Set up trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.12"
          cache: false
      -
        name: Bind trusted control Python
        shell: bash
        run: |
          set -euo pipefail
          control_python="$(command -v python)"
          case "$control_python" in
            /*) ;;
            *)
              echo "Trusted control Python is not absolute." >&2
              exit 1
              ;;
          esac
          [ -x "$control_python" ]
          control_version="$("$control_python" -I -B --version 2>&1)"
          if [ "$control_version" != "Python 3.13.12" ]; then
            echo "Trusted control Python version is invalid." >&2
            exit 1
          fi
          control_home="$RUNNER_TEMP/bootstrap-history-ci/control-home"
          install -d -m 700 "$control_home"
          {
            printf 'CONTROL_HOME=%s\n' "$control_home"
            printf 'CONTROL_PYTHON=%s\n' "$control_python"
          } >>"$GITHUB_ENV"
      -
        name: Bind live PR
        shell: bash
        env:
          EVENT_BASE_REF: "${{ github.event.pull_request.base.ref }}"
          EVENT_BASE_SHA: "${{ github.event.pull_request.base.sha }}"
          EVENT_HEAD_REF: "${{ github.event.pull_request.head.ref }}"
          EVENT_HEAD_REPOSITORY: "${{ github.event.pull_request.head.repo.full_name }}"
          EVENT_HEAD_SHA: "${{ github.event.pull_request.head.sha }}"
          EVENT_NODE_ID: "${{ github.event.pull_request.node_id }}"
          EVENT_NUMBER: "${{ github.event.pull_request.number }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          "$CONTROL_PYTHON" -I -B \
            "$TRUSTED_ROOT/scripts/trusted_history_ci.py" snapshot \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$EVENT_NUMBER" \
            --pr-node-id "$EVENT_NODE_ID" \
            --base-ref "$EVENT_BASE_REF" \
            --base-sha "$EVENT_BASE_SHA" \
            --head-repository "$EVENT_HEAD_REPOSITORY" \
            --head-ref "$EVENT_HEAD_REF" \
            --head-sha "$EVENT_HEAD_SHA" \
            --output "$RUNNER_TEMP/bootstrap-pr-snapshot.json"
      -
        name: Fetch bounded bootstrap graph without checkout
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 131072
          ulimit -n 256

          authenticated_fetch() {
            local basic_auth
            basic_auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            GIT_CONFIG_COUNT=2 \
              GIT_CONFIG_KEY_0=protocol.version \
              GIT_CONFIG_VALUE_0=2 \
              GIT_CONFIG_KEY_1=http.https://github.com/.extraheader \
              GIT_CONFIG_VALUE_1="AUTHORIZATION: basic $basic_auth" \
              timeout --signal=TERM --kill-after=5s 120s \
                git --git-dir="$CANDIDATE_GIT_DIR" fetch \
                  --quiet --no-tags "$@"
            unset basic_auth
          }

          clear_partial_clone() {
            local cleanup_status remote_url
            local -a remotes
            mapfile -t remotes < <(git --git-dir="$CANDIDATE_GIT_DIR" remote)
            if [ "${#remotes[@]}" -gt 1 ]; then
              echo "Candidate store retained multiple remote fallbacks." >&2
              return 1
            fi
            if [ "${#remotes[@]}" -eq 1 ]; then
              remote_url="$(
                git --git-dir="$CANDIDATE_GIT_DIR" remote get-url "${remotes[0]}"
              )"
              if [ "$remote_url" != "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" ]; then
                echo "Candidate store retained an unexpected remote fallback." >&2
                return 1
              fi
              git --git-dir="$CANDIDATE_GIT_DIR" remote remove "${remotes[0]}"
            fi
            if git --git-dir="$CANDIDATE_GIT_DIR" \
                config --unset-all extensions.partialClone; then
              return 0
            else
              cleanup_status=$?
            fi
            if [ "$cleanup_status" -ne 5 ]; then
              echo "Partial clone cleanup failed." >&2
              return 1
            fi
          }

          git init --bare --quiet "$CANDIDATE_GIT_DIR"
          timeout --signal=TERM --kill-after=5s 60s \
            git --git-dir="$CANDIDATE_GIT_DIR" fetch \
              --quiet --no-tags --depth=2 "$TRUSTED_ROOT" "$TRUSTED_SHA"
          authenticated_fetch --depth=3 --filter=blob:none \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            "+refs/pull/$PR_NUMBER/head:refs/bootstrap/candidate"
          clear_partial_clone
          if [ "$(
              git --git-dir="$CANDIDATE_GIT_DIR" rev-parse refs/bootstrap/candidate
            )" != "$CANDIDATE_SHA" ]; then
            echo "Fetched PR ref differs from H." >&2
            exit 1
          fi
          if [ "$B0_SHA" != "$TRUSTED_SHA" ]; then
            echo "Bootstrap candidate base changed after event binding." >&2
            exit 1
          fi
          if git --git-dir="$CANDIDATE_GIT_DIR" remote | read -r _remote; then
            echo "Candidate object store retained a remote." >&2
            exit 1
          fi
          printf 'B0_SHA=%s\n' "$B0_SHA" >>"$GITHUB_ENV"
      -
        name: Preflight exact signed bootstrap H
        id: preflight
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          ulimit -f 32768
          ulimit -n 256
          ulimit -t 180
          "$CONTROL_PYTHON" -I -B \
            "$TRUSTED_ROOT/scripts/trusted_history_ci.py" preflight \
            --git-dir "$CANDIDATE_GIT_DIR" \
            --base-sha "$B0_SHA" \
            --head-sha "$CANDIDATE_SHA" \
            --policy bootstrap-v2 \
            --repository "$GITHUB_REPOSITORY" \
            --output "$PREFLIGHT_MANIFEST"
      -
        name: Materialize only preflight-bounded blobs
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 131072
          ulimit -n 256
          ulimit -t 600
          timeout --signal=TERM --kill-after=5s 900s \
            "$CONTROL_PYTHON" -I -B \
              "$TRUSTED_ROOT/scripts/trusted_history_ci.py" \
              materialize-blobs \
              --git-dir "$CANDIDATE_GIT_DIR" \
              --manifest "$PREFLIGHT_MANIFEST" \
              --repository "$GITHUB_REPOSITORY"
      -
        name: Verify signature and materialize H as data
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 131072
          ulimit -n 256
          ulimit -t 300
          env -u GH_TOKEN -u GITHUB_TOKEN \
            "$CONTROL_PYTHON" -I -B \
              "$TRUSTED_ROOT/scripts/trusted_history_ci.py" \
              verify-objects \
              --git-dir "$CANDIDATE_GIT_DIR" \
              --manifest "$PREFLIGHT_MANIFEST"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            git --git-dir="$CANDIDATE_GIT_DIR" fsck \
              --full --strict --no-dangling "$CANDIDATE_SHA"
          git --git-dir="$CANDIDATE_GIT_DIR" worktree add \
            --quiet --detach "$CANDIDATE_ROOT" "$CANDIDATE_SHA"
      -
        name: Establish read-only H mount
        id: mount-data
        shell: bash
        run: |
          set -euo pipefail
          roots=("$CANDIDATE_ROOT")
          for root in "${roots[@]}"; do
            resolved="$(realpath "$root")"
            case "$resolved" in
              "$GITHUB_WORKSPACE/candidate")
                ;;
              *)
                echo "Materialized data escaped the expected workspace." >&2
                exit 1
                ;;
            esac
            sudo mount --bind "$resolved" "$resolved"
            sudo mount -o remount,bind,ro "$resolved"
            mountpoint -q "$resolved"
            case ",$(findmnt --noheadings --output OPTIONS --target "$resolved")," in
              *,ro,*)
                ;;
              *)
                echo "Materialized data mount is not read-only." >&2
                exit 1
                ;;
            esac
          done
      -
        name: Validate B0/H candidate feedback
        id: trusted-validation
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 32768
          ulimit -n 256
          ulimit -t 600
          output="$RUNNER_TEMP/bootstrap-validation.log"
          command=(
            "$CONTROL_PYTHON" -I -B \
              "$TRUSTED_ROOT/scripts/validate_retained_history.py"
            --base-root "$TRUSTED_ROOT"
            --candidate-root "$CANDIDATE_ROOT"
            --mode bootstrap-v2-candidate
          )
          if ! timeout --signal=TERM --kill-after=5s 900s \
              env -i HOME="$RUNNER_TEMP" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
                PATH="$PATH" GIT_CONFIG_GLOBAL=/dev/null \
                GIT_CONFIG_NOSYSTEM=1 GIT_OPTIONAL_LOCKS=0 \
                PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
                "${command[@]}" >"$output" 2>&1; then
            tail -n 120 "$output" >&2
            exit 1
          fi
      -
        name: Prepare sealed candidate runtime tree
        id: prepare-runtime-execution
        shell: bash
        run: |
          set -euo pipefail
          runtime_state="$RUNNER_TEMP/bootstrap-history-ci/runtime"
          authority_receipt="$runtime_state/authority-receipt.json"
          execution_root="$runtime_state/execution"
          pycache_root="$runtime_state/pycache"
          test_home="$runtime_state/home"
          test_tmp="$runtime_state/tmp"
          install -d -m 755 "$runtime_state"
          install -d -m 700 "$pycache_root" "$test_home" "$test_tmp"
          "$CONTROL_PYTHON" -I -B \
            "$TRUSTED_ROOT/scripts/trusted_history_ci.py" \
            prepare-runtime-execution \
            --git-dir "$CANDIDATE_GIT_DIR" \
            --execution-root "$execution_root" \
            --expected-head "$CANDIDATE_SHA" \
            --output "$authority_receipt"
          test_uid="$(id -u nobody)"
          test_gid="$(id -g nobody)"
          sudo chown -R "$test_uid:$test_gid" \
            "$pycache_root" "$test_home" "$test_tmp"
          sudo -u nobody -- test -r "$execution_root/requirements-v2.txt"
          sudo -u nobody -- test ! -w "$execution_root"
          {
            printf 'RUNTIME_AUTHORITY_RECEIPT=%s\n' "$authority_receipt"
            printf 'RUNTIME_EXECUTION_ROOT=%s\n' "$execution_root"
            printf 'RUNTIME_PYCACHE_ROOT=%s\n' "$pycache_root"
            printf 'RUNTIME_TEST_HOME=%s\n' "$test_home"
            printf 'RUNTIME_TEST_TMP=%s\n' "$test_tmp"
          } >>"$GITHUB_ENV"
      -
        name: Install sealed candidate test dependencies
        id: runtime-dependencies
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 8192
          ulimit -n 256
          test_venv="$RUNNER_TEMP/bootstrap-history-ci/runtime-venv"
          "$CONTROL_PYTHON" -I -B -m venv "$test_venv"
          runtime_python="$test_venv/bin/python"
          runtime_python_target="$(readlink -f -- "$runtime_python")"
          case "$runtime_python_target" in
            /*) ;;
            *)
              echo "Candidate runtime Python target is not absolute." >&2
              exit 1
              ;;
          esac
          [ -f "$runtime_python_target" ]
          [ -x "$runtime_python_target" ]
          runtime_python_sha256="$(/usr/bin/sha256sum -- "$runtime_python_target")"
          runtime_python_sha256="${runtime_python_sha256%% *}"
          runtime_venv_config="$test_venv/pyvenv.cfg"
          runtime_venv_config_sha256="$(/usr/bin/sha256sum -- "$runtime_venv_config")"
          runtime_venv_config_sha256="${runtime_venv_config_sha256%% *}"
          runtime_python_version="$($runtime_python -I -B --version 2>&1)"
          [ "$runtime_python_version" = "Python 3.13.12" ]
          verify_runtime_python() {
            local observed_target observed_sha256 observed_config_sha256
            observed_target="$(readlink -f -- "$runtime_python")"
            [ "$observed_target" = "$runtime_python_target" ]
            observed_sha256="$(/usr/bin/sha256sum -- "$observed_target")"
            observed_sha256="${observed_sha256%% *}"
            [ "$observed_sha256" = "$runtime_python_sha256" ]
            observed_config_sha256="$(/usr/bin/sha256sum -- "$runtime_venv_config")"
            observed_config_sha256="${observed_config_sha256%% *}"
            [ "$observed_config_sha256" = "$runtime_venv_config_sha256" ]
            [ "$($runtime_python -I -B --version 2>&1)" = "Python 3.13.12" ]
          }
          output="$RUNNER_TEMP/bootstrap-history-ci/runtime-pip.log"
          if ! timeout --signal=TERM --kill-after=5s 180s \
              env -u GH_TOKEN -u GITHUB_TOKEN -u PYTHONHOME -u PYTHONPATH \
                HOME="$RUNTIME_TEST_HOME" \
                PIP_CONFIG_FILE=/dev/null PIP_DISABLE_PIP_VERSION_CHECK=1 \
                "$test_venv/bin/python" -I -m pip install \
                  --isolated --no-cache-dir --no-input --only-binary=:all: \
                  --require-hashes \
                  --requirement "$RUNTIME_EXECUTION_ROOT/requirements-v2.txt" \
                  --quiet >"$output" 2>&1; then
            /usr/bin/tail -c 65536 -- "$output" |
              /usr/bin/base64 -w 76 |
              /usr/bin/sed 's/^/diagnostic-base64: /' >&2
            exit 1
          fi
          verify_runtime_python
          chmod -R u+rwX,go=rX "$test_venv"
          chmod -R a-w "$test_venv"
          verify_runtime_python
          sudo -u nobody -- test -x "$test_venv/bin/python"
          sudo -u nobody -- test ! -w "$test_venv"
          sudo -u nobody -- test ! -w "$runtime_python_target"
          {
            printf 'RUNTIME_TEST_PYTHON=%s\n' "$runtime_python"
            printf 'RUNTIME_TEST_PYTHON_SHA256=%s\n' "$runtime_python_sha256"
            printf 'RUNTIME_TEST_PYTHON_TARGET=%s\n' "$runtime_python_target"
            printf 'RUNTIME_TEST_VENV_CONFIG=%s\n' "$runtime_venv_config"
            printf 'RUNTIME_TEST_VENV_CONFIG_SHA256=%s\n' \
              "$runtime_venv_config_sha256"
          } >>"$GITHUB_ENV"
      -
        name: Run sealed candidate compile and tests
        id: runtime-tests
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 16384
          ulimit -n 256
          ulimit -t 600
          output="$RUNNER_TEMP/bootstrap-history-ci/runtime-tests.log"
          observed_target="$(readlink -f -- "$RUNTIME_TEST_PYTHON")"
          [ "$observed_target" = "$RUNTIME_TEST_PYTHON_TARGET" ]
          observed_sha256="$(/usr/bin/sha256sum -- "$observed_target")"
          observed_sha256="${observed_sha256%% *}"
          [ "$observed_sha256" = "$RUNTIME_TEST_PYTHON_SHA256" ]
          observed_config_sha256="$(
            /usr/bin/sha256sum -- "$RUNTIME_TEST_VENV_CONFIG"
          )"
          observed_config_sha256="${observed_config_sha256%% *}"
          [ "$observed_config_sha256" = "$RUNTIME_TEST_VENV_CONFIG_SHA256" ]
          [ "$($RUNTIME_TEST_PYTHON -I -B --version 2>&1)" = "Python 3.13.12" ]
          sudo -u nobody -- test ! -w "$(dirname "$RUNTIME_TEST_PYTHON")/.."
          sudo -u nobody -- test ! -w "$observed_target"
          run_as_test_uid=(
            sudo -u nobody --
            /usr/bin/env -i -C "$RUNTIME_EXECUTION_ROOT"
            HOME="$RUNTIME_TEST_HOME"
            LANG=C.UTF-8
            LC_ALL=C.UTF-8
            PATH=/usr/bin:/bin
            TMPDIR="$RUNTIME_TEST_TMP"
            GIT_CONFIG_GLOBAL=/dev/null
            GIT_CONFIG_NOSYSTEM=1
            GIT_OPTIONAL_LOCKS=0
            PYTHONDONTWRITEBYTECODE=1
            PYTHONHASHSEED=0
            "$RUNTIME_TEST_PYTHON"
          )
          if ! timeout --signal=TERM --kill-after=5s 900s \
              "${run_as_test_uid[@]}" \
                -I -B -X "pycache_prefix=$RUNTIME_PYCACHE_ROOT" \
                -m compileall -q -f scripts tests \
                >"$output" 2>&1; then
            /usr/bin/tail -c 65536 -- "$output" |
              /usr/bin/base64 -w 76 |
              /usr/bin/sed 's/^/diagnostic-base64: /' >&2
            exit 1
          fi
          if ! timeout --signal=TERM --kill-after=5s 900s \
              "${run_as_test_uid[@]}" \
                -I -B -X "pycache_prefix=$RUNTIME_PYCACHE_ROOT" \
                -m unittest discover -s tests \
                >"$output" 2>&1; then
            /usr/bin/tail -c 65536 -- "$output" |
              /usr/bin/base64 -w 76 |
              /usr/bin/sed 's/^/diagnostic-base64: /' >&2
            exit 1
          fi
      -
        name: Verify candidate runtime authority remains pristine
        id: verify-runtime-authority
        if: "${{ always() && steps.prepare-runtime-execution.outcome == 'success' }}"
        shell: bash
        run: |
          set -euo pipefail
          "$CONTROL_PYTHON" -I -B \
            "$TRUSTED_ROOT/scripts/trusted_history_ci.py" \
            verify-runtime-authority \
            --git-dir "$CANDIDATE_GIT_DIR" \
            --execution-root "$RUNTIME_EXECUTION_ROOT" \
            --expected-head "$CANDIDATE_SHA" \
            --receipt "$RUNTIME_AUTHORITY_RECEIPT"
      -
        name: Release read-only H mount
        id: release-data
        if: "${{ always() }}"
        shell: bash
        env:
          MOUNT_OUTCOME: "${{ steps.mount-data.outcome }}"
          VALIDATION_OUTCOME: "${{ steps.trusted-validation.outcome }}"
        run: |
          set -u
          integrity_ok=true
          roots=("$CANDIDATE_ROOT")
          expected=("$CANDIDATE_SHA")
          for index in "${!roots[@]}"; do
            root="${roots[$index]}"
            if mountpoint -q "$root"; then
              case ",$(findmnt --noheadings --output OPTIONS --target "$root" 2>/dev/null || true)," in
                *,ro,*)
                  ;;
                *)
                  integrity_ok=false
                  ;;
              esac
              if [ "$VALIDATION_OUTCOME" = success ]; then
                observed="$(
                  git -C "$root" rev-parse HEAD 2>/dev/null || true
                )"
                dirty="$(
                  GIT_OPTIONAL_LOCKS=0 git -C "$root" status \
                    --porcelain=v1 --untracked-files=all \
                    --ignored=matching 2>/dev/null || printf invalid
                )"
                if [ "$observed" != "${expected[$index]}" ] || [ -n "$dirty" ]; then
                  integrity_ok=false
                fi
              fi
              sudo umount "$root" || integrity_ok=false
            elif [ "$MOUNT_OUTCOME" = success ]; then
              integrity_ok=false
            fi
          done
          if [ "$integrity_ok" != true ]; then
            echo "Read-only data mount integrity or cleanup failed." >&2
            exit 1
          fi
      -
        name: Publish bootstrap gate evidence
        if: "${{ always() }}"
        shell: bash
        env:
          PREFLIGHT_OUTCOME: "${{ steps.preflight.outcome }}"
          RUNTIME_AUTHORITY_OUTCOME: "${{ steps.verify-runtime-authority.outcome }}"
          RUNTIME_DEPENDENCIES_OUTCOME: "${{ steps.runtime-dependencies.outcome }}"
          RUNTIME_PREPARE_OUTCOME: "${{ steps.prepare-runtime-execution.outcome }}"
          RUNTIME_TESTS_OUTCOME: "${{ steps.runtime-tests.outcome }}"
          RELEASE_OUTCOME: "${{ steps.release-data.outcome }}"
          VALIDATION_OUTCOME: "${{ steps.trusted-validation.outcome }}"
        run: |
          set -euo pipefail
          # Markdown code spans are intentionally literal.
          # shellcheck disable=SC2016
          {
            printf '### Trusted bootstrap gate\n\n'
            printf -- '- Event model: `%s`\n' "$EVENT_KIND"
            printf -- '- Bootstrap base B0: `%s`\n' "$B0_SHA"
            printf -- '- Signed candidate H: `%s`\n' "$CANDIDATE_SHA"
            printf '%s\n' \
              '- This baseline-owned result is candidate feedback only.'
            printf '%s\n' \
              '- Exact H passed credential-free, nonprivileged compile and tests from a sealed execution tree.'
            printf '%s\n' \
              '- It cannot authorize formal-history mutation; external admission and the history authority CAS remain mandatory.'
          } >>"$GITHUB_STEP_SUMMARY"
          [ "$PREFLIGHT_OUTCOME" = success ]
          [ "$RUNTIME_PREPARE_OUTCOME" = success ]
          [ "$RUNTIME_DEPENDENCIES_OUTCOME" = success ]
          [ "$RUNTIME_TESTS_OUTCOME" = success ]
          [ "$RUNTIME_AUTHORITY_OUTCOME" = success ]
          [ "$VALIDATION_OUTCOME" = success ]
          [ "$RELEASE_OUTCOME" = success ]
